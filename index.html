<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guitar Tab Writer</title>
  <link rel="stylesheet" href="styles.css?v=33" />
</head>
<body>
  <header>
    <h1>Guitar Tab Writer</h1>
    <div class="header-actions">
      <button id="new-btn" title="Start a new blank song">+ New</button>
      <button id="collection-btn" title="Set up or open your Collection — a GuitarTabWriterCollection folder created inside a location you pick">Collection</button>
      <button id="folder-btn" title="Open a folder of .cho charts and edit them in place">Open folder</button>
      <button id="reopen-btn" title="Reopen the last folder" hidden>Reopen folder</button>
      <button id="save-btn" title="Save this chart to its file (Cmd/Ctrl+S)" hidden>Save</button>
      <button id="import-btn" title="Open a .txt / .cho file">Import</button>
      <button id="export-btn" title="Download this song as a file">Export</button>
      <button id="metro-btn" title="Metronome">Metronome</button>
      <button id="tuner-btn" title="Instrument tuner (uses your microphone)">Tuner</button>
      <button id="perform-btn" title="Full-screen performance view">Perform</button>
      <button id="print-btn" title="Print / save as PDF">Print</button>
      <input type="file" id="import-input" accept=".txt,.cho,.chordpro,.crd,.pdf,text/plain,application/pdf" hidden />
    </div>
  </header>

  <main>
    <aside id="sidebar">
      <div class="sidebar-head">
        <span>Songs</span>
        <span id="song-count" class="muted"></span>
      </div>
      <div id="folder-bar" class="folder-bar" hidden></div>
      <ul id="song-list"></ul>
    </aside>

    <section id="workspace">
      <div class="meta-row">
        <input id="title-input" class="title-input" type="text" placeholder="Song title" />
        <input id="artist-input" class="artist-input" type="text" placeholder="Artist (optional)" />
        <div class="stepper">
          <label>Transpose</label>
          <button id="tr-down" title="Down a semitone">&minus;</button>
          <span id="tr-amount">0</span>
          <button id="tr-up" title="Up a semitone">+</button>
        </div>
        <div class="stepper">
          <label>Capo</label>
          <button id="capo-down" title="Move capo down a fret">&minus;</button>
          <span id="capo-amount">0</span>
          <button id="capo-up" title="Move capo up a fret">+</button>
        </div>
      </div>

      <!-- Where the current chart is saved: system colour + folder path + state. -->
      <div id="save-breadcrumb" class="save-breadcrumb" hidden></div>

      <div class="panes">
        <div class="pane editor-pane">
          <div class="pane-head">
            <span>Editor</span>
            <span class="hint">
              <button id="pagebreak-btn" class="inline-btn" title="Insert a page break at the cursor">Insert page break</button>
              <button id="clear-chords-btn" class="inline-btn" title="Remove every [chord] from this chart (keeps lyrics and sections)">Clear chords</button>
              <span class="etool">Transpose text
                <button id="tr-text-down" class="inline-btn" title="Transpose the written chords down a semitone">&minus;</button>
                <button id="tr-text-up" class="inline-btn" title="Transpose the written chords up a semitone">+</button>
              </span>
              <span class="etool">Replace
                <select id="replace-from" class="repl-sel" title="Chord to replace"></select>
                &rarr;
                <input id="replace-to" class="repl-in" type="text" placeholder="chord" spellcheck="false" title="Replacement chord" />
                <button id="replace-go" class="inline-btn" title="Replace every instance of this chord">Replace</button>
              </span>
            </span>
          </div>
          <div id="section-bar" class="section-bar"></div>
          <div id="chord-palette" class="chord-palette"></div>
          <textarea id="editor" spellcheck="false" placeholder="[G]Type your lyrics here and drop [C]chords in [D]brackets...

Blank lines and section labels like {Verse 1} or [Chorus] work too."></textarea>
        </div>

        <div class="pane preview-pane">
          <div class="pane-head">
            <span>Preview</span>
            <span class="view-toggles">
              <label title="Show chord diagrams for each instrument"><input type="checkbox" id="toggle-chords" checked /> Chords</label>
              <label title="Show a scale map for each instrument"><input type="checkbox" id="toggle-scales" checked /> Scales</label>
              <span class="tog-sep">|</span>
              <label class="print-cols-ctl" title="Number of columns when you print / save as PDF">Print
                <select id="print-cols">
                  <option value="1">1 col</option>
                  <option value="2">2 cols</option>
                </select>
              </label>
              <span id="save-status" class="muted"></span>
            </span>
          </div>
          <div id="preview" class="preview">
            <div id="print-header"></div>
            <div id="capo-banner"></div>
            <!-- The jam: on/off chip per instrument, built by renderInstrumentBar(). -->
            <div id="instrument-bar" class="instrument-bar"></div>
            <div id="harmonica-panel" class="harmonica-panel"></div>
            <!-- One section per active instrument (chords + scale), built by renderInstruments(). -->
            <div id="instrument-panels"></div>
            <div id="preview-body"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Metronome + drum machine (floating panel) -->
  <div id="metro-panel" class="tool-panel tool-panel-wide" hidden>
    <div class="tool-head"><span>Metronome &amp; Drum Machine</span><button class="tool-close" data-tool="metro" title="Close">&#10005;</button></div>
    <div class="tool-body">
      <div class="metro-tempo">
        <button id="metro-down" title="Slower">&minus;</button>
        <span id="metro-bpm" class="metro-bpm">100</span>
        <button id="metro-up" title="Faster">+</button>
        <span class="metro-unit">BPM</span>
      </div>
      <input id="metro-slider" class="metro-slider" type="range" min="40" max="240" value="100" />
      <div class="metro-row">
        <span class="dm-steps-ctl">Steps
          <button id="dm-steps-down" title="Fewer steps">&minus;</button>
          <span id="dm-steps">16</span>
          <button id="dm-steps-up" title="More steps">+</button>
        </span>
        <label class="dm-click-lbl"><input type="checkbox" id="dm-click" checked /> Click</label>
        <button id="metro-tap" title="Tap to set the tempo">Tap</button>
      </div>
      <div id="dm-grid" class="dm-grid"></div>
      <div class="metro-row dm-actions">
        <button id="metro-toggle" class="tool-start">Start</button>
        <button id="dm-clear" title="Clear the pattern">Clear</button>
      </div>
    </div>
  </div>

  <!-- Tuner (floating panel) -->
  <div id="tuner-panel" class="tool-panel" hidden>
    <div class="tool-head"><span>Tuner</span><button class="tool-close" data-tool="tuner" title="Close">&#10005;</button></div>
    <div class="tool-body">
      <label class="tuner-preset-lbl">Tuning
        <select id="tuner-preset">
          <option value="standard">Standard (EADGBE)</option>
          <option value="dropD">Drop D (DADGBE)</option>
          <option value="dadgad">DADGAD</option>
          <option value="jamesTaylor">James Taylor (sweetened)</option>
        </select>
      </label>
      <div id="tuner-strings" class="tuner-strings"></div>
      <div id="tuner-note" class="tuner-note">&mdash;</div>
      <div class="tuner-meter">
        <div class="tuner-ticks"></div>
        <div id="tuner-needle" class="tuner-needle"></div>
      </div>
      <div id="tuner-cents" class="tuner-cents">Start, then play a single note.</div>
      <button id="tuner-toggle" class="tool-start">Start</button>
    </div>
  </div>

  <!-- PDF drop / conversion overlay. Doubles as the drag hint and the OCR
       progress display; script wiring lives in app.js (convertPdfFile). -->
  <div id="pdf-overlay" class="pdf-overlay" hidden>
    <div class="pdf-card">
      <div id="pdf-spinner" class="pdf-spinner" hidden></div>
      <div class="pdf-icon">&#127925;</div>
      <div id="pdf-msg" class="pdf-msg">Drop a PDF chart to convert it</div>
      <div id="pdf-sub" class="pdf-sub">Chords-over-lyrics PDFs become an editable draft</div>
    </div>
  </div>

  <!-- Full-screen performance view. Hidden until "Perform" is clicked. -->
  <div id="perform-overlay" class="perform-overlay" hidden>
    <div id="perform-bar" class="perform-bar">
      <span class="pf-song" id="pf-song"></span>
      <div class="pf-group">
        <label>Columns</label>
        <button id="pf-col-down" title="Fewer columns">&minus;</button>
        <span id="pf-cols" class="pf-num">4</span>
        <button id="pf-col-up" title="More columns">+</button>
      </div>
      <div class="pf-group">
        <label>Size</label>
        <button id="pf-font-down" title="Smaller text">&minus;</button>
        <span id="pf-font" class="pf-num">22</span>
        <button id="pf-font-up" title="Larger text">+</button>
        <button id="pf-fit" title="Shrink text to fit one screen">Fit</button>
      </div>
      <div class="pf-group pf-toggles">
        <label>Show</label>
        <button class="pf-toggle" data-panel="instruments">Instruments</button>
        <button class="pf-toggle" data-panel="harp">Harmonica</button>
      </div>
      <div class="pf-group">
        <button id="pf-prev-song" title="Previous song (&larr; at start)">&#9664; Song</button>
        <button id="pf-next-song" title="Next song (&rarr; at end)">Song &#9654;</button>
      </div>
      <span class="pf-page" id="pf-page"></span>
      <button id="pf-exit" class="pf-exit" title="Exit performance mode (Esc)">&#10005;</button>
    </div>
    <div id="perform-panels" class="perform-panels"></div>
    <div id="perform-viewport" class="perform-viewport">
      <div id="perform-cols" class="perform-cols preview"></div>
    </div>
  </div>

  <!-- Bump ?v= on every deploy so browsers fetch fresh JS/CSS (Pages caches
       these for 10 min otherwise). -->
  <script src="chords.js?v=33"></script>
  <script src="pdf2cho.js?v=33"></script>
  <script src="app.js?v=33"></script>
</body>
</html>
