<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guitar Tab Writer</title>
  <link rel="stylesheet" href="styles.css?v=6" />
</head>
<body>
  <header>
    <h1>Guitar Tab Writer</h1>
    <div class="header-actions">
      <button id="new-btn" title="Start a new blank song">+ New</button>
      <button id="folder-btn" title="Open a folder of .cho charts and edit them in place">Open folder</button>
      <button id="reopen-btn" title="Reopen the last folder" hidden>Reopen folder</button>
      <button id="save-btn" title="Save this chart to its file (Cmd/Ctrl+S)" hidden>Save</button>
      <button id="import-btn" title="Open a .txt / .cho file">Import</button>
      <button id="export-btn" title="Download this song as a file">Export</button>
      <button id="perform-btn" title="Full-screen performance view">Perform</button>
      <button id="print-btn" title="Print / save as PDF">Print</button>
      <input type="file" id="import-input" accept=".txt,.cho,.chordpro,.crd,text/plain" hidden />
    </div>
  </header>

  <main>
    <aside id="sidebar">
      <div class="sidebar-head">
        <span>Songs</span>
        <span id="song-count" class="muted"></span>
      </div>
      <div id="folder-bar" class="folder-bar" hidden></div>
      <ul id="song-list"></ul>
    </aside>

    <section id="workspace">
      <div class="meta-row">
        <input id="title-input" class="title-input" type="text" placeholder="Song title" />
        <input id="artist-input" class="artist-input" type="text" placeholder="Artist (optional)" />
        <div class="stepper">
          <label>Transpose</label>
          <button id="tr-down" title="Down a semitone">&minus;</button>
          <span id="tr-amount">0</span>
          <button id="tr-up" title="Up a semitone">+</button>
        </div>
        <div class="stepper">
          <label>Capo</label>
          <button id="capo-down" title="Move capo down a fret">&minus;</button>
          <span id="capo-amount">0</span>
          <button id="capo-up" title="Move capo up a fret">+</button>
        </div>
      </div>

      <div class="panes">
        <div class="pane editor-pane">
          <div class="pane-head">
            <span>Editor</span>
            <span class="hint">
              Chords in brackets: <code>[G]When the night has [C]come</code>
              &nbsp;&middot;&nbsp;
              <button id="pagebreak-btn" class="inline-btn" title="Insert a page break at the cursor">Insert page break</button>
              &nbsp;&middot;&nbsp;
              <button id="clear-chords-btn" class="inline-btn" title="Remove every [chord] from this chart (keeps lyrics and sections)">Clear chords</button>
            </span>
          </div>
          <div id="section-bar" class="section-bar"></div>
          <div id="chord-palette" class="chord-palette"></div>
          <textarea id="editor" spellcheck="false" placeholder="[G]Type your lyrics here and drop [C]chords in [D]brackets...

Blank lines and section labels like {Verse 1} or [Chorus] work too."></textarea>
        </div>

        <div class="pane preview-pane">
          <div class="pane-head">
            <span>Preview</span>
            <span class="view-toggles">
              <label><input type="checkbox" id="toggle-diagrams" checked /> Chords</label>
              <label><input type="checkbox" id="toggle-lead" checked /> Lead set</label>
              <label><input type="checkbox" id="toggle-harmonica" checked /> Harmonica</label>
              <label class="print-cols-ctl" title="Number of columns when you print / save as PDF">Print
                <select id="print-cols">
                  <option value="1">1 col</option>
                  <option value="2">2 cols</option>
                </select>
              </label>
              <span id="save-status" class="muted"></span>
            </span>
          </div>
          <div id="preview" class="preview">
            <div id="print-header"></div>
            <div id="capo-banner"></div>
            <div id="rhythm-section" class="chord-section">
              <div class="section-label" id="rhythm-label">Rhythm</div>
              <div id="chord-diagrams" class="chord-diagrams"></div>
            </div>
            <div id="lead-section" class="chord-section">
              <div class="section-label">Lead</div>
              <div id="lead-diagrams" class="chord-diagrams"></div>
              <div id="scale-panel" class="scale-panel"></div>
            </div>
            <div id="harmonica-panel" class="harmonica-panel"></div>
            <div id="preview-body"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Full-screen performance view. Hidden until "Perform" is clicked. -->
  <div id="perform-overlay" class="perform-overlay" hidden>
    <div id="perform-bar" class="perform-bar">
      <span class="pf-song" id="pf-song"></span>
      <div class="pf-group">
        <label>Columns</label>
        <button id="pf-col-down" title="Fewer columns">&minus;</button>
        <span id="pf-cols" class="pf-num">4</span>
        <button id="pf-col-up" title="More columns">+</button>
      </div>
      <div class="pf-group">
        <label>Size</label>
        <button id="pf-font-down" title="Smaller text">&minus;</button>
        <span id="pf-font" class="pf-num">22</span>
        <button id="pf-font-up" title="Larger text">+</button>
        <button id="pf-fit" title="Shrink text to fit one screen">Fit</button>
      </div>
      <div class="pf-group pf-toggles">
        <label>Show</label>
        <button class="pf-toggle" data-panel="chords">Chords</button>
        <button class="pf-toggle" data-panel="lead">Lead</button>
        <button class="pf-toggle" data-panel="scale">Scale</button>
        <button class="pf-toggle" data-panel="harp">Harp</button>
      </div>
      <div class="pf-group">
        <button id="pf-prev-song" title="Previous song (&larr; at start)">&#9664; Song</button>
        <button id="pf-next-song" title="Next song (&rarr; at end)">Song &#9654;</button>
      </div>
      <span class="pf-page" id="pf-page"></span>
      <button id="pf-exit" class="pf-exit" title="Exit performance mode (Esc)">&#10005;</button>
    </div>
    <div id="perform-panels" class="perform-panels"></div>
    <div id="perform-viewport" class="perform-viewport">
      <div id="perform-cols" class="perform-cols preview"></div>
    </div>
  </div>

  <!-- Bump ?v= on every deploy so browsers fetch fresh JS/CSS (Pages caches
       these for 10 min otherwise). -->
  <script src="chords.js?v=6"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
